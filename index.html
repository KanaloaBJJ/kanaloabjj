<!doctype html><html lang="es"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#111827"><link rel="manifest" href="manifest.webmanifest?v=10.3"><link rel="icon" href="icon.svg?v=10.3">
<title>Kanaloa BJJ</title>
<style>
body{margin:0;font-family:system-ui;background:#f4f5f7;color:#111827}header{background:#111827;color:#fff;padding:16px;position:sticky;top:0;z-index:2}header h1{margin:0;font-size:21px}
main{max-width:900px;margin:auto;padding:14px 14px 85px}.card{background:white;border:1px solid #e5e7eb;border-radius:16px;padding:14px;margin:10px 0}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.between{justify-content:space-between}.stat{font-size:27px;font-weight:800}.muted{color:#6b7280}.small{font-size:12px}button,input{font:inherit}button{border:0;border-radius:10px;padding:10px 12px;background:#111827;color:white}button.secondary{background:#e5e7eb;color:#111827}button.danger{background:#fee2e2;color:#991b1b}input{padding:10px;border:1px solid #e5e7eb;border-radius:10px;width:100%;box-sizing:border-box}label{display:block;font-size:12px;color:#6b7280;margin:8px 0 4px}
.student{display:flex;justify-content:space-between;gap:8px;align-items:center;padding:10px 0;border-bottom:1px solid #eee}.student:last-child{border-bottom:0}.hidden{display:none!important}
.nav{position:fixed;bottom:0;left:0;right:0;background:white;border-top:1px solid #ddd;display:flex;justify-content:center;z-index:5}.nav button{flex:1;max-width:130px;background:transparent;color:#374151;font-size:12px;border-radius:0}.nav button.active{font-weight:800}
.auth{max-width:420px;margin:9vh auto}.notice{background:#fef3c7;color:#78350f;padding:10px;border-radius:10px;margin:8px 0}.success{background:#dcfce7;color:#166534;padding:10px;border-radius:10px;margin:8px 0}
table{width:100%;border-collapse:collapse}td,th{padding:8px;border-bottom:1px solid #eee;text-align:left}
</style><style id="v8-auth-style">
#v8-auth-overlay{position:fixed;inset:0;z-index:100000;background:#f5f7fb;display:flex;align-items:center;justify-content:center;padding:20px;box-sizing:border-box}
#v8-auth-card{width:min(420px,100%);background:#fff;border-radius:20px;padding:28px;box-shadow:0 12px 40px rgba(0,0,0,.14);box-sizing:border-box}
#v8-auth-card h1{margin:0 0 8px;font-size:26px} #v8-auth-card p{margin:0 0 20px;color:#667085}
#v8-auth-card label{display:block;font-size:14px;font-weight:600;margin-top:10px}
#v8-auth-card input{width:100%;box-sizing:border-box;padding:13px 14px;border:1px solid #d0d5dd;border-radius:10px;margin:6px 0 10px;font-size:16px}
#v8-auth-login{width:100%;padding:13px;border:0;border-radius:10px;font-size:16px;font-weight:700;cursor:pointer;background:#111827;color:#fff}
#v8-auth-error{color:#b42318;min-height:20px;margin:6px 0 10px;font-size:14px}
body.v8-auth-pending > *:not(#v8-auth-overlay){visibility:hidden}
</style>
<style id="v10-student-style">
#v10-student-modal{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:130000;display:none;align-items:flex-end;justify-content:center}
#v10-student-sheet{background:#fff;width:min(680px,100%);max-height:92vh;overflow:auto;border-radius:22px 22px 0 0;padding:22px;box-sizing:border-box}
#v10-student-head{display:flex;justify-content:space-between;align-items:center;gap:12px}
#v10-student-close{border:0;background:#eee;border-radius:10px;padding:8px 12px;font-size:18px}
.v10-field{margin:16px 0}.v10-field label{display:block;font-weight:700;margin-bottom:7px}
.v10-field input{width:100%;box-sizing:border-box;padding:13px;border:1px solid #d0d5dd;border-radius:10px;font-size:16px}
.v10-choice-row{display:flex;flex-wrap:wrap;gap:8px}
.v10-choice{border:1px solid #d0d5dd;background:#fff;border-radius:12px;padding:11px 13px;font-weight:700;cursor:pointer}
.v10-choice.selected{outline:3px solid #111827;border-color:#111827}
#v10-save{width:100%;border:0;background:#111827;color:#fff;border-radius:12px;padding:14px;font-size:16px;font-weight:800;margin-top:12px}

</style>

<style id="v10-2-grade-style">
#v10-grades{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}
#v10-grades .v10-choice{
  aspect-ratio:1/1;
  min-width:0;
  padding:0;
  display:flex;

}

#v10-delete{
  width:100%;
  border:1px solid #fecaca;
  background:#fee2e2;
  color:#991b1b;
  border-radius:12px;
  padding:14px;
  font-size:16px;

</head><body class="v8-auth-pending"><div id="v8-auth-overlay"><div id="v8-auth-card">
<h1>🥋 Kanaloa BJJ</h1><p>Acceso privado de la academia</p>
<form id="v8-auth-form">
<label>Email</label><input id="v8-auth-email" type="email" autocomplete="username" value="kanaloacalafell@gmail.com" required>
<label>Contraseña</label><input id="v8-auth-password" type="password" autocomplete="current-password" required>
<div id="v8-auth-error"></div><button id="v8-auth-login" type="submit">Entrar</button>
</form></div></div>
<header><h1>🥋 Kanaloa BJJ</h1><small id="sub">Base de datos online</small></header>
<div id="auth" class="auth card hidden"><h2>Acceso</h2><p class="muted">Los datos se comparten entre los dispositivos que inicien sesión.</p>
<label>Email</label><input id="email" type="email"><label>Contraseña</label><input id="password" type="password">
<div class="row" style="margin-top:12px"><button id="login">Entrar</button><button class="secondary" id="signup">Crear cuenta</button></div><div id="authmsg" class="small muted"></div></div>
<main id="app" class="hidden"><div id="dashboard"></div><div id="attendance" class="hidden"></div><div id="students" class="hidden"></div><div id="history" class="hidden"></div><div id="ranking" class="hidden"></div><div id="rules" class="hidden"></div></main>
<nav id="nav" class="nav hidden"><button data-v="dashboard">🏠<br>Inicio</button><button data-v="attendance">✅<br>Lista</button><button data-v="students">👥<br>Alumnos</button><button data-v="history">📚<br>Historial</button><button data-v="ranking">🏆<br>Ranking</button><button data-v="rules">⚙️<br>Ajustes</button></nav>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js"></script>
<script>
const U=window.BJJ_SUPABASE_URL,K=window.BJJ_SUPABASE_PUBLISHABLE_KEY;let sb,students=[],att=[],rules={},settings={inactivity_days:21,academy_name:"BJJ Academy"},view="dashboard",date=new Date().toISOString().slice(0,10),slot="morning";const belts=["Blanco","Azul","Morado","Marrón","Negro"];
const $=id=>document.getElementById(id),esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function toast(x,ok=false){let d=document.createElement("div");d.className=ok?"success":"notice";d.textContent=x;$("app").prepend(d);setTimeout(()=>d.remove(),3000)}
function showAuth(){ $("auth").classList.remove("hidden");$("app").classList.add("hidden");$("nav").classList.add("hidden")}
function showConfig(){showAuth();$("authmsg").textContent="Configura primero supabase-config.js con la URL y Publishable key.";$("login").disabled=true;$("signup").disabled=true}
async function login(){let {error}=await sb.auth.signInWithPassword({email:$("email").value.trim(),password:$("password").value});$("authmsg").textContent=error?.message||""}
async function signup(){let {error}=await sb.auth.signUp({email:$("email").value.trim(),password:$("password").value});$("authmsg").textContent=error?.message||"Cuenta creada. Revisa el correo si se solicita verificación."}
async function load(){let [s,a,r,x]=await Promise.all([sb.from("students").select("*").eq("active",true).order("name"),sb.from("attendance").select("*"),sb.from("belt_rules").select("*"),sb.from("app_settings").select("*").eq("id",1).maybeSingle()]);let er=[s,a,r,x].find(q=>q.error);if(er)throw Error(er.error.message);students=s.data||[];att=a.data||[];rules={};(r.data||[]).forEach(q=>rules[q.belt]=[q.grade1,q.grade2,q.grade3,q.grade4]);if(x.data)settings=x.data;$("sub").textContent=settings.academy_name+" · datos online"}
function t(b){return rules[b]||[30,30,30,30]}function total(id){return att.filter(a=>a.student_id===id).length}function last(id){return att.filter(a=>a.student_id===id).map(a=>a.date).sort().at(-1)||null}
function prog(s){let z=t(s.belt),prior=z.slice(0,Math.max(0,s.grade)).reduce((a,b)=>a+b,0),need=z[Math.max(0,s.grade)]||0,done=Math.max(0,total(s.id)-prior);return{done,need,pct:need?Math.min(100,Math.round(done/need*100)):100}}
function days(d){return d?Math.floor((Date.now()-new Date(d+"T00:00:00"))/86400000):null}
function setView(v){view=v;["dashboard","attendance","students","history","ranking","rules"].forEach(x=>$(x).classList.toggle("hidden",x!==v));document.querySelectorAll(".nav button").forEach(b=>b.classList.toggle("active",b.dataset.v===v));render()}
function render(){
 $("dashboard").innerHTML=`<div class="grid"><div class="card"><div class="muted">Alumnos</div><div class="stat">${students.length}</div></div><div class="card"><div class="muted">Asistencias hoy</div><div class="stat">${att.filter(a=>a.date===new Date().toISOString().slice(0,10)).length}</div></div><div class="card"><div class="muted">Total sesiones</div><div class="stat">${att.length}</div></div></div><div class="card"><h3>🚨 Avisos</h3>${students.map(s=>{let p=prog(s),d=days(last(s.id));return p.pct>=100||d>=settings.inactivity_days?`<div class="student"><span><b>${esc(s.name)}</b><br><span class="small">${s.belt} · grado ${s.grade}</span></span><span>${p.pct>=100?"Grado alcanzado":d+" días sin venir"}</span></div>`:""}).join("")||"<p class='muted'>Sin avisos.</p>"}</div><div class="card"><button onclick="logout()">Cerrar sesión</button></div>`;
 $("attendance").innerHTML=`<div class="card"><h2>Pasar lista</h2><label>Fecha</label><input id="ad" type="date" value="${date}"><label>Sesión</label><div class="row"><button onclick="slot='morning';render()">🌅 Mañana</button><button onclick="slot='afternoon';render()">🌇 Tarde</button></div><p class="small muted">Marca mañana y tarde por separado. Ambas = 2 asistencias.</p></div><div class="card">${students.map(s=>{let ok=att.some(a=>a.student_id===s.id&&a.date===date&&a.slot===slot);return `<div class="student" style="cursor:pointer" onclick="studentHistory('${s.id}')"><span><b>${esc(s.name)}</b><br><span class="small">${s.belt} · grado ${s.grade}</span></span><button class="${ok?"secondary":""}" onclick="toggle('${s.id}')">${ok?"✅ Presente":"Marcar"}</button></div>`}).join("")}</div>`;$("ad").onchange=e=>{date=e.target.value;render()};
 $("students").innerHTML=`<div class="card"><div class="row between"><h2>Alumnos</h2><button onclick="addStudent()">+ Añadir</button></div><input id="search" placeholder="Buscar..."><div id="sl">${students.map(card).join("")}</div></div>`;$("search").oninput=e=>$("sl").innerHTML=students.filter(s=>s.name.toLowerCase().includes(e.target.value.toLowerCase())).map(card).join("");
 let by={};att.forEach(a=>(by[a.date]??=[]).push(a));$("history").innerHTML=`<div class="card"><h2>Historial</h2>${Object.keys(by).sort().reverse().map(d=>`<div class="student" style="cursor:pointer" onclick="classHistory('${d}')"><span><b>${d}</b><br><span class="small">🌅 ${by[d].filter(a=>a.slot==="morning").length} · 🌇 ${by[d].filter(a=>a.slot==="afternoon").length}</span></span><b>${by[d].length}</b></div>`).join("")||"<p class='muted'>Sin datos.</p>"}</div>`;
 let mo=new Date().toISOString().slice(0,7),m=$("rm")?.value||mo,c={};att.filter(a=>a.date.startsWith(m)).forEach(a=>c[a.student_id]=(c[a.student_id]||0)+1);let rr=students.map(s=>({...s,n:c[s.id]||0})).sort((a,b)=>b.n-a.n||a.name.localeCompare(b.name));$("ranking").innerHTML=`<div class="card"><h2>🏆 Ranking mensual</h2><label>Mes</label><input id="rm" type="month" value="${m}"><p class="small muted">Cada sesión cuenta 1; mañana+tarde = 2.</p><table><tr><th>#</th><th>Alumno</th><th>Sesiones</th></tr>${rr.map((s,i)=>`<tr><td>${i<3?["🥇","🥈","🥉"][i]:i+1}</td><td>${esc(s.name)}</td><td><b>${s.n}</b></td></tr>`).join("")}</table></div>`;$("rm").onchange=render;
 $("rules").innerHTML=`<div class="card"><h2>⚙️ Reglas</h2><p class="small muted">Los valores son de demostración; configura los de tu academia.</p>${belts.map(b=>`<div class="card"><b>${b}</b><div class="grid">${t(b).map((v,i)=>`<div><label>Grado ${i+1}</label><input id="r${b}${i}" type="number" value="${v}"></div>`).join("")}</div></div>`).join("")}<label>Días para aviso de inactividad</label><input id="inact" type="number" value="${settings.inactivity_days}"><br><br><button onclick="saveRules()">Guardar en la nube</button><button class="secondary" onclick="logout()">Cerrar sesión</button></div>`;
}
function card(s){let p=prog(s),l=last(s.id);return `<div class="student" style="cursor:pointer" onclick="studentHistory('${s.id}')"><span><b>${esc(s.name)}</b><br><span class="small">${s.belt} · grado ${s.grade} · ${p.done}/${p.need} · ${l?"última "+l:"sin asistencia"}</span></span><button class="secondary" onclick="event.stopPropagation();edit('${s.id}')">Editar</button></div>`}
async function studentHistory(id){let s=students.find(x=>x.id===id);let rows=att.filter(a=>a.student_id===id).sort((a,b)=>b.date.localeCompare(a.date));$("students").innerHTML=`<div class="card"><button class="secondary" onclick="render()">← Volver</button><h2>${esc(s.name)}</h2><p>${s.belt} · grado ${s.grade}</p><h3>Historial de asistencias (${rows.length})</h3>${rows.map(a=>`<div class="student"><span><b>${a.date}</b><br><span class="small">${a.slot==="morning"?"🌅 Mañana":"🌇 Tarde"}</span></span></div>`).join("")||"<p class='muted'>Sin asistencias.</p>"}</div>`}
async function classHistory(d){let rows=att.filter(a=>a.date===d);let names=id=>students.find(s=>s.id===id)?.name||"Alumno";$("history").innerHTML=`<div class="card"><button class="secondary" onclick="render()">← Volver</button><h2>Clase · ${d}</h2><h3>🌅 Mañana</h3>${rows.filter(a=>a.slot==="morning").map(a=>`<div class="student"><b>${esc(names(a.student_id))}</b></div>`).join("")||"<p class='muted'>Sin alumnos.</p>"}<h3>🌇 Tarde</h3>${rows.filter(a=>a.slot==="afternoon").map(a=>`<div class="student"><b>${esc(names(a.student_id))}</b></div>`).join("")||"<p class='muted'>Sin alumnos.</p>"}</div>`}
async function toggle(id){let e=att.find(a=>a.student_id===id&&a.date===date&&a.slot===slot);let q=e?await sb.from("attendance").delete().eq("id",e.id):await sb.from("attendance").insert({student_id:id,date,slot});if(q.error)toast(q.error.message);else{await load();render()}}
function addStudent(){ window.openV10StudentForm(null); }
function edit(id){ let s=students.find(x=>x.id===id); window.openV10StudentForm(s); }
async function saveRules(){for(let b of belts){let v=[0,1,2,3].map(i=>parseInt($("r"+b+i).value,10)||1);let q=await sb.from("belt_rules").upsert({belt:b,grade1:v[0],grade2:v[1],grade3:v[2],grade4:v[3]});if(q.error)return toast(q.error.message)}let q=await sb.from("app_settings").upsert({id:1,inactivity_days:parseInt($("inact").value,10)||21});if(q.error)toast(q.error.message);else{await load();toast("Reglas guardadas.",true);render()}}
async function logout(){await sb.auth.signOut()}
async function boot(){ $("auth").classList.add("hidden");$("app").classList.remove("hidden");$("nav").classList.remove("hidden");try{await load();setView("dashboard")}catch(e){toast(e.message)}}
document.querySelectorAll(".nav button").forEach(b=>b.onclick=()=>setView(b.dataset.v));
if(!U||!K)showConfig();else{sb=supabase.createClient(U,K,{auth:{persistSession:true,autoRefreshToken:true}});$("login").onclick=login;$("signup").onclick=signup;sb.auth.onAuthStateChange((_e,s)=>s?boot():showAuth());sb.auth.getSession().then(x=>x.data.session?boot():showAuth())}
if("serviceWorker"in navigator)navigator.serviceWorker.register("sw.js?v=10.3",{updateViaCache:"none"}).then(r=>r.update());
</script><script id="v8-auth-script">
(function(){
const ALLOWED="kanaloacalafell@gmail.com";
const overlay=document.getElementById("v8-auth-overlay"), form=document.getElementById("v8-auth-form");
const email=document.getElementById("v8-auth-email"), pass=document.getElementById("v8-auth-password"), err=document.getElementById("v8-auth-error");
function show(){document.body.classList.remove("v8-auth-pending");overlay.style.display="none"}
function login(msg){document.body.classList.add("v8-auth-pending");overlay.style.display="flex";err.textContent=msg||""}
async function boot(){
 if(!window.supabase?.createClient){login("No se ha podido cargar el acceso.");return}
 if(!window.BJJ_SUPABASE_URL||!window.BJJ_SUPABASE_PUBLISHABLE_KEY){login("Falta la configuración de Supabase.");return}
 const client=window.supabase.createClient(window.BJJ_SUPABASE_URL,window.BJJ_SUPABASE_PUBLISHABLE_KEY);
 window.bjjSupabaseClient=client;
 const {data:{session}}=await client.auth.getSession();
 if(session?.user?.email?.toLowerCase()===ALLOWED) show(); else login("");
 client.auth.onAuthStateChange((_e,s)=>s?.user?.email?.toLowerCase()===ALLOWED?show():login(""));
 form.addEventListener("submit",async e=>{
  e.preventDefault(); err.textContent="";
  if(email.value.trim().toLowerCase()!==ALLOWED){err.textContent="Usa el email de la academia.";return}
  const {error}=await client.auth.signInWithPassword({email:email.value.trim(),password:pass.value});
  if(error) err.textContent="Email o contraseña incorrectos.";
 });
}
if(document.readyState==="loading") document.addEventListener("DOMContentLoaded",()=>setTimeout(boot,100)); else setTimeout(boot,100);
})();
</script>
<div id="v10-student-modal">
 <div id="v10-student-sheet">
  <div id="v10-student-head"><h2 id="v10-form-title">Nuevo alumno</h2><button id="v10-student-close">✕</button></div>
  <form id="v10-student-form">
   <input type="hidden" id="v10-student-id">
   <div class="v10-field"><label>Nombre</label><input id="v10-first-name" required autocomplete="given-name"></div>
   <div class="v10-field"><label>Apellidos</label><input id="v10-last-name" autocomplete="family-name"></div>
   <div class="v10-field"><label>Cinturón</label>
    <div class="v10-choice-row" id="v10-belts">
     <button type="button" class="v10-choice" data-value="Blanco">⚪ Blanco</button>
     <button type="button" class="v10-choice" data-value="Azul">🔵 Azul</button>
     <button type="button" class="v10-choice" data-value="Morado">🟣 Morado</button>
     <button type="button" class="v10-choice" data-value="Marrón">🟤 Marrón</button>
     <button type="button" class="v10-choice" data-value="Negro">⚫ Negro</button>
    </div>
   </div>
   <div class="v10-field"><label>Grados</label>
    <div class="v10-choice-row" id="v10-grades">
     <button type="button" class="v10-choice" data-value="0">0</button>
     <button type="button" class="v10-choice" data-value="1">1</button>
     <button type="button" class="v10-choice" data-value="2">2</button>

    </div>
   </div>
   <div id="v10-error"></div>
   <button id="v10-save" type="submit">Guardar alumno</button>
    <button id="v10-delete" class="hidden" type="button">🗑️ Eliminar alumno</button>
  </form>
 </div>
</div>

<script id="v10-student-form-script">
(function(){
 const modal=document.getElementById('v10-student-modal'), form=document.getElementById('v10-student-form');
 const first=document.getElementById('v10-first-name'), last=document.getElementById('v10-last-name'), sid=document.getElementById('v10-student-id');
 const err=document.getElementById('v10-error'), title=document.getElementById('v10-form-title');
 let belt='Blanco', grade=0;
 function choose(group,val){
  document.querySelectorAll('#'+group+' .v10-choice').forEach(b=>b.classList.toggle('selected',String(b.dataset.value)===String(val)));
 }
 function openStudent(s){
  sid.value=s?.id||''; first.value=s?.first_name||s?.name?.split(' ')[0]||'';
  last.value=s?.last_name||((s?.name||'').split(' ').slice(1).join(' '));
  belt=s?.belt||'Blanco'; grade=Number(s?.grade??0);
  choose('v10-belts',belt);choose('v10-grades',grade);
  title.textContent=s?.id?'Editar alumno':'Nuevo alumno';document.getElementById('v10-delete').classList.toggle('hidden',!s?.id);err.textContent='';modal.style.display='flex';
 }
 function close(){modal.style.display='none'}
 document.getElementById('v10-student-close').onclick=close;
 modal.addEventListener('click',e=>{if(e.target===modal)close()});
 document.querySelectorAll('#v10-belts .v10-choice').forEach(b=>b.onclick=()=>{belt=b.dataset.value;choose('v10-belts',belt)});
 document.querySelectorAll('#v10-grades .v10-choice').forEach(b=>b.onclick=()=>{grade=Number(b.dataset.value);choose('v10-grades',grade)});
 form.addEventListener('submit',async e=>{
  e.preventDefault(); err.textContent='';
  const c=window.sb||sb||window.bjjSupabaseClient;if(!c){err.textContent='No hay conexión con Supabase.';return}
  const fn=first.value.trim(), ln=last.value.trim(); if(!fn){err.textContent='Escribe el nombre.';return}
  const payload={name:(fn+' '+ln).trim(),first_name:fn,last_name:ln,belt,grade};
  let q=sid.value?c.from('students').update(payload).eq('id',sid.value):c.from('students').insert(payload);
  const {error}=await q;
  if(error){err.textContent='No se pudo guardar: '+error.message;return}
  close(); if(typeof load==='function'){await load();} if(typeof render==='function'){render();}
 });
